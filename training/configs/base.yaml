model_size: "1.5b"
checkpoint_dir: "checkpoints"

learning_rate: 3.0e-4
weight_decay: 0.01
warmup_steps: 1000

log_every: 100
save_every: 1000
num_workers: 4

alignment_batch_size: 32
pretraining_batch_size: 16
instruction_batch_size: 8

alignment_data_path: "data/alignment"
pretraining_data_path: "data/pretraining"
instruction_data_path: "data/instruction"

vocab_size: 50277
temperature: 0.07
lm_weight: 1.0
contrastive_weight: 0.1
aux_weight: 0.01
